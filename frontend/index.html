<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Osdag Secure Files</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; --ink:#17202a; --muted:#65727e; --accent:#0c6e70; --line:#dce4e7; --paper:#f5f7f5; }
    body { margin:0; color:var(--ink); background:linear-gradient(135deg,#f5f7f5,#e6f0ef); min-height:100vh; }
    main { max-width:760px; margin:0 auto; padding:48px 20px; }
    header { display:flex; justify-content:space-between; align-items:start; gap:20px; margin-bottom:32px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem,6vw,4rem); letter-spacing:-.04em; }
    p { color:var(--muted); }
    section { background:#fff; border:1px solid var(--line); padding:24px; margin:16px 0; box-shadow:0 12px 35px #17454812; }
    label { display:block; margin:12px 0 6px; font-weight:600; }
    input, select, button { box-sizing:border-box; width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; }
    button { color:#fff; background:var(--accent); border:0; cursor:pointer; font-weight:700; margin-top:14px; }
    button.secondary { background:#edf3f2; color:var(--accent); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .hidden { display:none; }
    li { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
    li button { width:auto; margin:0; }
    #status { min-height:24px; color:var(--accent); font-weight:600; }
    @media (max-width:560px) { header,.row { display:block; } header select { margin-top:16px; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>Secure files</h1><p>One client, two backend implementations.</p></div><select id="backend"><option value="custom">Custom FastAPI</option><option value="appwrite">Managed Appwrite</option></select></header>
  <section id="auth">
    <div class="row"><div><label for="email">Email</label><input id="email" type="email" value="user1@test.com"></div><div><label for="password">Password</label><input id="password" type="password" value="password123"></div></div>
    <div class="row"><button id="login">Log in</button><button class="secondary" id="register">Register</button></div>
  </section>
  <section id="account" class="hidden"><p id="profile"></p><button class="secondary" id="logout">Log out</button></section>
  <section id="files" class="hidden"><h2>Your files</h2><ul id="file-list"></ul><input id="upload" type="file"><button id="upload-button">Upload file</button></section>
  <p id="status" role="status"></p>
</main>
<script>
const config = { custom: 'http://localhost:8000', appwrite: 'http://localhost:8001' };
let token = sessionStorage.getItem('osdag-token');
const $ = id => document.getElementById(id);
function base() { return config[$('backend').value]; }
async function api(path, options = {}) { const headers = { ...(options.body instanceof FormData ? {} : {'Content-Type':'application/json'}), ...(token ? {Authorization:`Bearer ${token}`} : {}), ...options.headers }; const response = await fetch(base()+path, {...options, headers}); const data = await response.json().catch(()=>({})); if (!response.ok) throw new Error(data.error || data.detail || 'Request failed'); return data; }
function message(text) { $('status').textContent = text; }
async function login() { try { const body = {email:$('email').value,password:$('password').value}; const options = $('backend').value === 'custom' ? {method:'POST',body:new URLSearchParams({username:body.email,password:body.password}),headers:{'Content-Type':'application/x-www-form-urlencoded'}} : {method:'POST',body:JSON.stringify(body)}; const data = await api('/login', options); token = data.access_token || data.token; sessionStorage.setItem('osdag-token', token); await loadAccount(); message('Logged in'); } catch (e) { message(e.message); } }
async function register() { try { const body = {email:$('email').value,password:$('password').value}; await api('/register', {method:'POST', body:JSON.stringify(body)}); message('Account created. Log in to continue.'); } catch (e) { message(e.message); } }
async function loadAccount() { const me = await api('/me'); $('auth').classList.add('hidden'); $('account').classList.remove('hidden'); $('files').classList.remove('hidden'); $('profile').textContent = `${me.email} (account ${me.id})`; const files = await api('/files'); $('file-list').replaceChildren(...files.map(file => { const item=document.createElement('li'); item.textContent=file.filename; const button=document.createElement('button'); button.textContent='Download'; button.onclick=()=>download(file.id,file.filename); item.append(button); return item; })); }
async function download(id, name) { const response = await fetch(base()+`/files/${id}/download`, {headers:{Authorization:`Bearer ${token}`}}); if (!response.ok) return message('Download denied'); const blob=await response.blob(); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=name; link.click(); URL.revokeObjectURL(link.href); }
$('login').onclick=login; $('register').onclick=register; $('backend').onchange=()=>{ token=null; sessionStorage.removeItem('osdag-token'); location.reload(); }; $('logout').onclick=async()=>{ try { await api('/logout',{method:'POST'}); } finally { token=null; sessionStorage.removeItem('osdag-token'); location.reload(); } }; $('upload-button').onclick=async()=>{ const data=new FormData(); data.append('file',$('upload').files[0]); try { await api('/files/upload',{method:'POST',body:data}); await loadAccount(); message('Uploaded'); } catch(e) { message(e.message); } }; if (token) loadAccount().catch(()=>{ token=null; sessionStorage.removeItem('osdag-token'); });
</script>
</body>
</html>
